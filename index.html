<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050506">
<title>Obsidian LITE</title><meta name="version" content="1780348472">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<style>
#splash{position:fixed;inset:0;background:#050506;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
#debug{position:fixed;bottom:0;left:0;right:0;background:rgba(255,0,0,.9);color:#fff;font-size:11px;padding:8px;z-index:9999;display:none;word-break:break-all;max-height:40vh;overflow:auto}
</style>
</head>
<body>
<div id="debug" onclick="this.style.display='none'" style="cursor:pointer;position:fixed;bottom:0;left:0;right:0;background:rgba(255,0,0,.9);color:#fff;font-size:11px;padding:8px;z-index:9999;display:none;word-break:break-all;max-height:40vh;overflow:auto"></div>
<div id="splash">
  <svg width="64" height="64" viewBox="0 0 80 80" fill="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#9B4FDE"/><stop offset="100%" stop-color="#5B1FA0"/></linearGradient></defs>
    <polygon points="40,4 72,20 76,52 56,76 24,76 4,52 8,20" fill="url(#g)" opacity=".15"/>
    <polygon points="40,4 72,20 76,52 56,76 24,76 4,52 8,20" fill="none" stroke="url(#g)" stroke-width="1.5"/>
    <polygon points="40,18 62,28 64,50 50,66 30,66 16,50 18,28" fill="url(#g)" opacity=".3"/>
    <polygon points="40,30 54,36 55,50 45,60 35,60 25,50 26,36" fill="url(#g)" opacity=".6"/>
    <circle cx="40" cy="40" r="6" fill="#C89CFF" opacity=".9"/>
  </svg>
  <div style="font-size:20px;font-weight:700;color:#F4F4F6">Obsidian <span style="color:#A86CE0">LITE</span></div>
  <div style="font-size:11px;letter-spacing:.15em;color:#6E6A7A">PRECISION TRADING INTELLIGENCE.</div>
  <div id="splash-status" style="font-size:12px;color:#6E6A7A;margin-top:8px">Loading...</div>
</div>
<div id="app" style="display:none;flex-direction:column;height:100dvh;overflow:hidden">
  <div class="screen" id="screen" style="flex:1;overflow-y:auto;padding:16px"></div>
  <nav id="nav" style="display:none">
    <button class="nav-btn active" data-screen="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></button>
    <button class="nav-btn" data-screen="activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>Activity</span></button>
    <button class="nav-btn" data-screen="markets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Markets</span></button>
    <button class="nav-btn" data-screen="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg><span>More</span></button>
    <button class="nav-btn" data-screen="admin" id="nav-admin" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>Admin</span></button>
  </nav>
</div>
<script>
function dbg(msg){const d=document.getElementById('debug');d.style.display='block';d.innerHTML+=msg+'<br>';const s=document.getElementById('splash-status');if(s)s.textContent=msg;}
window.onerror=function(m,s,l){dbg('ERROR: '+m+' @ '+s.split('/').pop()+':'+l);return false;};
window.addEventListener('unhandledrejection',function(e){dbg('PROMISE: '+(e.reason?.message||e.reason));});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onload="dbg('✓ supabase')" onerror="dbg('✗ supabase FAILED')"></script>
<script src="/js/supabase.js" onload="dbg('✓ db')" onerror="dbg('✗ db FAILED')"></script>
<script src="/js/engine.js" onload="dbg('✓ engine')" onerror="dbg('✗ engine FAILED')"></script>
<script src="/js/screens/auth.js" onload="dbg('✓ auth')" onerror="dbg('✗ auth FAILED')"></script>
<script src="/js/screens/onboarding.js" onload="dbg('✓ onboarding')" onerror="dbg('✗ onboarding FAILED')"></script>
<script src="/js/screens/dashboard.js" onload="dbg('✓ dashboard')" onerror="dbg('✗ dashboard FAILED')"></script>
<script src="/js/screens/activity.js" onload="dbg('✓ activity')" onerror="dbg('✗ activity FAILED')"></script>
<script src="/js/screens/markets.js" onload="dbg('✓ markets')" onerror="dbg('✗ markets FAILED')"></script>
<script src="/js/screens/more.js" onload="dbg('✓ more')" onerror="dbg('✗ more FAILED')"></script>
<script src="/js/screens/admin.js" onload="dbg('✓ admin')" onerror="dbg('✗ admin FAILED')"></script>
<script src="/js/app.js" onload="dbg('✓ app')" onerror="dbg('✗ app FAILED')"></script>
</body>
</html>
